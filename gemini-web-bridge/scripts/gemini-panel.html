<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gemini Web2API — پنل مدیریت</title>
<style>
/* ═══════════════════════════════════════════════════════════════
   Gemini Web2API Admin Panel — Modern Dark Theme
   Inspired by 9router design language
   ═══════════════════════════════════════════════════════════════ */
:root {
  --bg: #0a0e1a;
  --bg-card: #121829;
  --bg-hover: #1a2138;
  --bg-input: #0e1525;
  --border: #1e2a45;
  --border-light: #2a3a5a;
  --text: #e0e7f0;
  --text-2: #a0aec0;
  --text-3: #6b7a99;
  --green: #22c55e;
  --green-bg: #0a2a1a;
  --green-border: #1a5a35;
  --red: #ef4444;
  --red-bg: #2a0a0a;
  --red-border: #5a1a1a;
  --yellow: #eab308;
  --yellow-bg: #2a2200;
  --yellow-border: #5a4a00;
  --blue: #3b82f6;
  --blue-bg: #0a1a2a;
  --blue-border: #1a3a5a;
  --purple: #a855f7;
  --purple-bg: #1a0a2a;
  --purple-border: #3a1a5a;
  --cyan: #06b6d4;
  --cyan-bg: #0a2a2a;
  --cyan-border: #1a4a4a;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 2px 8px rgba(0,0,0,.3);
  --shadow-lg: 0 8px 32px rgba(0,0,0,.4);
  --sans: 'Segoe UI', Tahoma, sans-serif;
  --mono: 'Cascadia Code', Consolas, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* ── Layout ── */
#app { display: flex; min-height: 100vh; }
.sidebar {
  width: 260px; flex: 0 0 260px;
  background: var(--bg-card);
  border-left: 1px solid var(--border);
  display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh;
  z-index: 100;
}
.main { flex: 1; min-width: 0; overflow-x: hidden; }

/* ── Sidebar ── */
.side-header {
  padding: 20px 20px 16px;
  border-bottom: 1px solid var(--border);
}
.side-brand {
  display: flex; align-items: center; gap: 10px;
  font-size: 17px; font-weight: 600; color: var(--text);
}
.side-brand .logo {
  width: 32px; height: 32px; border-radius: 8px;
  background: linear-gradient(135deg, #4285F4, #9B72CB, #D96570);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; color: #fff; font-weight: 700;
}
.side-brand .ver {
  font-size: 11px; color: var(--text-3); font-weight: 400;
  background: var(--bg-hover); padding: 2px 8px; border-radius: 6px;
}
.side-nav { padding: 12px; flex: 1; display: flex; flex-direction: column; gap: 4px; }
.side-nav button {
  all: unset; cursor: pointer;
  display: flex; align-items: center; gap: 12px;
  padding: 11px 14px; border-radius: var(--radius-sm);
  color: var(--text-2); font-size: 14px;
  transition: all .15s;
}
.side-nav button:hover { background: var(--bg-hover); color: var(--text); }
.side-nav button.active {
  background: var(--blue-bg); color: var(--blue);
  box-shadow: inset 0 0 0 1px var(--blue-border);
}
.side-nav button svg { width: 20px; height: 20px; flex: none; fill: currentColor; opacity: .8; }
.side-nav button.active svg { opacity: 1; }
.side-footer {
  padding: 16px 20px; border-top: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 10px;
}
.side-status {
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; color: var(--text-3);
}
.side-status .dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 0 3px rgba(34,197,94,.15);
}
.side-status .dot.red { background: var(--red); box-shadow: 0 0 0 3px rgba(239,68,68,.15); }
.side-status .dot.yellow { background: var(--yellow); box-shadow: 0 0 0 3px rgba(234,179,8,.15); }

/* ── Topbar ── */
.topbar {
  height: 60px; padding: 0 28px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--border);
  background: var(--bg-card);
  position: sticky; top: 0; z-index: 50;
}
.topbar-title { font-size: 18px; font-weight: 500; color: var(--text); }
.topbar-right { display: flex; align-items: center; gap: 12px; }
.badge-count {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 12px; border-radius: 999px;
  font-size: 12px; font-weight: 500;
}
.badge-count.green { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }
.badge-count.red { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-border); }
.badge-count.yellow { background: var(--yellow-bg); color: var(--yellow); border: 1px solid var(--yellow-border); }
.badge-count.blue { background: var(--blue-bg); color: var(--blue); border: 1px solid var(--blue-border); }

/* ── Content ── */
.content { padding: 24px 28px 48px; }
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px 24px;
  margin-bottom: 16px;
}
.card-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px; gap: 12px;
}
.card-title { font-size: 15px; font-weight: 500; color: var(--text); }
.card-desc { font-size: 12px; color: var(--text-3); margin-top: 4px; }

/* ── KPI Grid ── */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px; margin-bottom: 16px;
}
.kpi {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 20px;
}
.kpi-label { font-size: 12px; color: var(--text-3); margin-bottom: 6px; }
.kpi-value { font-size: 28px; font-weight: 600; color: var(--text); letter-spacing: -.02em; }
.kpi-sub { font-size: 11px; color: var(--text-3); margin-top: 4px; }
.kpi.green .kpi-value { color: var(--green); }
.kpi.red .kpi-value { color: var(--red); }
.kpi.yellow .kpi-value { color: var(--yellow); }
.kpi.blue .kpi-value { color: var(--blue); }

/* ── Tables ── */
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th {
  text-align: right; color: var(--text-3); font-weight: 500;
  font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
  padding: 10px 12px; border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
td {
  padding: 12px; border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover { background: var(--bg-hover); }
td.num { font-variant-numeric: tabular-nums; font-family: var(--mono); }
td.mono { font-family: var(--mono); font-size: 12px; }
.empty-row td { text-align: center; color: var(--text-3); padding: 32px; }

/* ── Badges ── */
.badge {
  display: inline-block; padding: 3px 10px; border-radius: 999px;
  font-size: 11px; font-weight: 500; white-space: nowrap;
}
.badge.ok { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }
.badge.fail { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-border); }
.badge.warn { background: var(--yellow-bg); color: var(--yellow); border: 1px solid var(--yellow-border); }
.badge.info { background: var(--blue-bg); color: var(--blue); border: 1px solid var(--blue-border); }
.badge.muted { background: var(--bg-hover); color: var(--text-3); border: 1px solid var(--border); }
.badge.purple { background: var(--purple-bg); color: var(--purple); border: 1px solid var(--purple-border); }

/* ── Buttons ── */
.btn {
  all: unset; box-sizing: border-box; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 16px; border-radius: var(--radius-sm);
  font-size: 13px; font-weight: 500; font-family: var(--sans);
  transition: all .15s;
  text-align: center; justify-content: center;
}
.btn-primary { background: var(--blue); color: #fff; }
.btn-primary:hover { background: #2563eb; }
.btn-success { background: var(--green); color: #fff; }
.btn-success:hover { background: #16a34a; }
.btn-danger { background: transparent; color: var(--red); border: 1px solid var(--red-border); }
.btn-danger:hover { background: var(--red-bg); }
.btn-ghost { background: var(--bg-hover); color: var(--text-2); border: 1px solid var(--border); }
.btn-ghost:hover { background: var(--border); color: var(--text); }
.btn-sm { padding: 5px 12px; font-size: 12px; }
.btn[disabled] { opacity: .4; cursor: default; pointer-events: none; }

/* ── Forms ── */
input, select, textarea {
  font-family: var(--sans); font-size: 13px; color: var(--text);
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 9px 12px; outline: none;
  transition: border-color .15s;
  width: 100%;
}
input:focus, select:focus, textarea:focus { border-color: var(--blue); }
textarea { font-family: var(--mono); font-size: 12px; resize: vertical; min-height: 60px; }
select { cursor: pointer; }
.form-group { margin-bottom: 14px; }
.form-label { display: block; margin-bottom: 6px; font-size: 12px; color: var(--text-2); font-weight: 500; }
.form-hint { font-size: 11px; color: var(--text-3); margin-top: 4px; line-height: 1.5; }

/* ── Progress bar ── */
.progress {
  height: 6px; background: var(--bg-input);
  border-radius: 999px; overflow: hidden;
  position: relative;
}
.progress-fill {
  height: 100%; border-radius: 999px;
  transition: width .4s ease;
}
.progress-fill.green { background: var(--green); }
.progress-fill.yellow { background: var(--yellow); }
.progress-fill.red { background: var(--red); }
.progress-fill.blue { background: var(--blue); }

/* ── Toggle switch ── */
.switch { appearance: none; -webkit-appearance: none; margin: 0; cursor: pointer;
  width: 40px; height: 22px; border-radius: 999px;
  background: var(--border); position: relative; transition: background .2s; }
.switch::before { content: ""; position: absolute; top: 2px; right: 2px; width: 18px; height: 18px;
  border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.switch:checked { background: var(--green); }
.switch:checked::before { transform: translateX(-18px); }
.switch:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

/* ── Modal ── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.6);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000; backdrop-filter: blur(4px);
}
.modal {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 24px 28px;
  width: min(520px, 92vw); box-shadow: var(--shadow-lg);
}
.modal h3 { font-size: 17px; font-weight: 500; margin-bottom: 8px; }
.modal-body { margin: 16px 0 20px; }
.modal-err { color: var(--red); font-size: 12px; margin-bottom: 10px; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; }

/* ── Toast ── */
.toast {
  position: fixed; bottom: 24px; left: 24px;
  background: var(--bg-card); border: 1px solid var(--border);
  color: var(--text); padding: 12px 20px;
  border-radius: var(--radius); font-size: 13px;
  z-index: 2000; box-shadow: var(--shadow-lg);
  animation: slideIn .2s ease;
}
.toast.success { border-color: var(--green-border); }
.toast.error { border-color: var(--red-border); }
@keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

/* ── Cookie health card ── */
.cookie-health {
  display: grid; grid-template-columns: 1fr 1fr 1fr;
  gap: 12px; margin-bottom: 16px;
}
.cookie-stat {
  background: var(--bg-input); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 14px 16px;
}
.cookie-stat-label { font-size: 11px; color: var(--text-3); margin-bottom: 4px; }
.cookie-stat-value { font-size: 16px; font-weight: 500; }
.cookie-stat-value.ok { color: var(--green); }
.cookie-stat-value.warn { color: var(--yellow); }
.cookie-stat-value.fail { color: var(--red); }
.cookie-stat-sub { font-size: 10px; color: var(--text-3); margin-top: 2px; }

/* ── Config grid ── */
.cfg-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 14px 18px;
}
.cfg-item { min-width: 0; }
.cfg-item.wide { grid-column: 1 / -1; }
.cfg-toggle {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 12px 0; border-top: 1px solid var(--border);
}
.cfg-toggle:first-child { border-top: none; padding-top: 2px; }
.cfg-toggle .switch { margin-top: 2px; }

/* ── Login ── */
.login-box {
  width: 380px; max-width: 92vw;
  margin: 15vh auto;
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 16px; padding: 32px;
  box-shadow: var(--shadow-lg);
}
.login-box h1 {
  font-size: 20px; font-weight: 500; margin-bottom: 24px;
  display: flex; align-items: center; gap: 10px;
}
.login-box input { margin-bottom: 14px; }
.login-box .btn { width: 100%; text-align: center; }
.login-err { color: var(--red); font-size: 12px; margin-top: 10px; text-align: center; }

/* ── Responsive ── */
@media (max-width: 900px) {
  #app { flex-direction: column; }
  .sidebar { width: 100%; flex-basis: auto; height: auto;
    position: static; border-left: none; border-bottom: 1px solid var(--border); }
  .side-nav { flex-direction: row; overflow-x: auto; padding: 8px 12px; }
  .side-nav button { padding: 8px 12px; white-space: nowrap; }
  .side-footer { display: none; }
  .topbar { padding: 0 16px; }
  .content { padding: 16px; }
  .kpi-grid { grid-template-columns: 1fr 1fr; }
  .cookie-health { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ═══════════════════════════════════════════════════════════════
// Gemini Web2API Admin Panel — Standalone
// ═══════════════════════════════════════════════════════════════

const API_BASE = '';  // Same origin — proxy handles /api/ → 8093/admin/api/
const ADMIN_TOKEN = 'testprobe123';

const api = async (path, opts = {}) => {
  // Proxy /admin/api/* through our Node.js proxy at /api/*
  const url = path.startsWith('/admin/api/')
    ? path.replace('/admin/api/', '/api/')
    : path;
  const r = await fetch(url, {
    credentials: 'include',
    ...opts,
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${ADMIN_TOKEN}`, ...(opts.headers || {}) }
  });
  if (r.status === 401) { renderLogin(); throw new Error('unauthorized'); }
  return r.json();
};

// ── Utilities ──
const fmt = {
  ts: (sec) => sec ? new Date(sec * 1000).toLocaleString('fa-IR') : '—',
  rel: (sec) => {
    if (!sec) return '—';
    const diff = Date.now() / 1000 - sec;
    if (diff < 60) return 'همین حالا';
    if (diff < 3600) return Math.floor(diff / 60) + ' دقیقه پیش';
    if (diff < 86400) return Math.floor(diff / 3600) + ' ساعت پیش';
    return Math.floor(diff / 86400) + ' روز پیش';
  },
  ms: (ms) => ms == null ? '—' : (ms < 1000 ? ms + 'ms' : (ms/1000).toFixed(1) + 's'),
  num: (n) => (n || 0).toLocaleString('fa-IR'),
  pct: (n) => (n * 100).toFixed(1) + '٪',
};

const escapeHtml = (s) => (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const toast = (msg, type = '') => {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3000);
};

// ── Icons ──
const ICONS = {
  dashboard: '<path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/>',
  cookie: '<path d="M12 2a10 10 0 100 20 10 10 0 000-20zm-1 4a1.5 1.5 0 11-3 0 1.5 1.5 0 013 0zm7 3a1.5 1.5 0 11-3 0 1.5 1.5 0 013 0zM8 13a1.5 1.5 0 11-3 0 1.5 1.5 0 013 0zm6 4a1.5 1.5 0 11-3 0 1.5 1.5 0 013 0z"/>',
  settings: '<path d="M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z"/>',
  models: '<path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>',
  key: '<path d="M7 14a5 5 0 110-10 5 5 0 010 10zm12-2h-2v2h-2v2h-2v2h-2v-2H9v-2H7v-2H5V8h2V6h2V4h4v2h2v2h2v2h2v2z"/>',
  proxy: '<path d="M12 2a2.5 2.5 0 011 4.79V9h4a2 2 0 012 2v1.21a2.5 2.5 0 11-2 0V11h-4v1.21a2.5 2.5 0 11-2 0V11H7v1.21a2.5 2.5 0 11-2 0V11a2 2 0 012-2h4V6.79A2.5 2.5 0 0112 2z"/>',
  chart: '<path d="M3 3v18h18v-2H5V3H3zm4 12h2v4H7v-4zm4-6h2v10h-2V9zm4 3h2v7h-2v-7zm4-9h2v16h-2V6z"/>',
  logout: '<path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5-5-5zM4 5h8V3H4a2 2 0 00-2 2v14a2 2 0 002 2h8v-2H4V5z"/>',
};

// ── Pages ──
let currentPage = 'dashboard';
const pages = {};

pages.dashboard = async () => {
  const [stats, usage, ck, cfgData] = await Promise.all([
    api('admin/api/stats?hours=24').catch(() => ({})),
    api('admin/api/usage').catch(() => ({})),
    api('admin/api/cookies').catch(() => ({})),
    api('admin/api/config').catch(() => ({})),
  ]);

  const cookies = ck.items || [];
  const aliveCookies = cookies.filter(c => c.health !== 'dead' && c.status === 'enabled');
  const deadCookies = cookies.filter(c => c.health === 'dead' || c.status === 'disabled');
  const totalReq = stats.total_requests || 0;
  const successRate = stats.success_rate || 0;

  // Cookie freshness
  const lastOk = cookies.length > 0 ? Math.max(...cookies.map(c => c.last_ok_at || 0)) : 0;
  const lastUsed = cookies.length > 0 ? Math.max(...cookies.map(c => c.last_used_at || 0)) : 0;
  const lastCreated = cookies.length > 0 ? Math.min(...cookies.map(c => c.created_at || 0)) : 0;

  return `
    <div class="kpi-grid">
      <div class="kpi ${aliveCookies.length > 0 ? 'green' : 'red'}">
        <div class="kpi-label">وضعیت کوکی</div>
        <div class="kpi-value">${aliveCookies.length > 0 ? 'فعال' : 'غیرفعال'}</div>
        <div class="kpi-sub">${aliveCookies.length} فعال / ${cookies.length} کل</div>
      </div>
      <div class="kpi ${successRate > 0.8 ? 'green' : successRate > 0.5 ? 'yellow' : 'red'}">
        <div class="kpi-label">نرخ موفقیت (24h)</div>
        <div class="kpi-value">${fmt.pct(successRate)}</div>
        <div class="kpi-sub">${fmt.num(stats.success || 0)} موفق / ${fmt.num(stats.failures || 0)} ناموفق</div>
      </div>
      <div class="kpi blue">
        <div class="kpi-label">درخواست کل (24h)</div>
        <div class="kpi-value">${fmt.num(totalReq)}</div>
        <div class="kpi-sub">میانگین ${fmt.ms(stats.avg_ms)}</div>
      </div>
      <div class="kpi ${aliveCookies.length > 0 ? 'green' : 'red'}">
        <div class="kpi-label">آخرین کوکی سالم</div>
        <div class="kpi-value" style="font-size:18px">${fmt.rel(lastOk)}</div>
        <div class="kpi-sub">${lastOk ? fmt.ts(lastOk) : '—'}</div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <div>
          <div class="card-title">سلامت کوکی‌ها</div>
          <div class="card-desc">وضعیت جزئیات هر کوکی — زمان آخرین استفاده، خطاها، و زمان تقریبی انقضا</div>
        </div>
        <button class="btn btn-primary btn-sm" onclick="addCookie()">+ افزودن کوکی</button>
      </div>
      ${renderCookieHealth(cookies)}
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-title">ترافیک 24 ساعت اخیر</div>
      </div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
        <div>
          <div style="font-size:12px; color:var(--text-3); margin-bottom:8px;">درخواست‌ها</div>
          <div class="progress"><div class="progress-fill blue" style="width:${Math.min(totalReq / 100 * 100, 100)}%"></div></div>

function renderCookieHealth(cookies) {
  if (!cookies.length) return '<div class="empty-row"><td>هیچ کوکی ثبت نشده</td></div>';
  return `
    <div class="cookie-health">
      <div class="cookie-stat">
        <div class="cookie-stat-label">آخرین successful</div>
        <div class="cookie-stat-value ${cookies.some(c=>c.last_ok_at) ? 'ok' : 'fail'}">${fmt.rel(Math.max(...cookies.map(c=>c.last_ok_at||0)))}</div>
        <div class="cookie-stat-sub">${fmt.ts(Math.max(...cookies.map(c=>c.last_ok_at||0)))}</div>
      </div>
      <div class="cookie-stat">
        <div class="cookie-stat-label">آخرین استفاده</div>
        <div class="cookie-stat-value">${fmt.rel(Math.max(...cookies.map(c=>c.last_used_at||0)))}</div>
        <div class="cookie-stat-sub">${fmt.ts(Math.max(...cookies.map(c=>c.last_used_at||0)))}</div>
      </div>
      <div class="cookie-stat">
        <div class="cookie-stat-label">تعداد کل</div>
        <div class="cookie-stat-value">${cookies.length}</div>
        <div class="cookie-stat-sub">${cookies.filter(c=>c.status==='enabled'&&c.health!=='dead').length} فعال</div>
      </div>
    </div>
    <table>
      <thead><tr><th>برچسب</th><th>وضعیت</th><th>Tokenها</th><th>آخرین موفق</th><th>آخرین استفاده</th><th>خطاها</th><th>عملیات</th></tr></thead>
      <tbody>
        ${cookies.map(c => {
          const isHealthy = c.health !== 'dead' && c.status === 'enabled';
          return `
            <tr>
              <td>${escapeHtml(c.label || '—')} ${c.authuser > 0 ? `<span class="badge info">/u/${c.authuser}</span>` : ''}</td>
              <td><span class="badge ${isHealthy ? 'ok' : 'fail'}">${isHealthy ? 'فعال' : c.health === 'dead' ? 'منقضی' : 'غیرفعال'}</span></td>
              <td class="num">${c.cookie_count || 0}</td>
              <td class="num">${c.last_ok_at ? fmt.rel(c.last_ok_at) : '—'}</td>
              <td class="num">${c.last_used_at ? fmt.rel(c.last_used_at) : '—'}</td>
              <td class="num">${c.fail_count > 0 ? `<span class="badge fail">${c.fail_count}</span>` : '0'}</td>
              <td>
                <span style="display:flex; gap:4px;">
                  <button class="btn btn-ghost btn-sm" onclick="checkCookie(${c.id})">بررسی</button>
                  <button class="btn btn-ghost btn-sm" onclick="rotateCookie(${c.id})">رفرش</button>
                  <button class="btn btn-ghost btn-sm" onclick="toggleCookie(${c.id})">${c.status === 'enabled' ? 'غیرفعال' : 'فعال'}</button>
                  <button class="btn btn-danger btn-sm" onclick="deleteCookie(${c.id})">حذف</button>
                </span>
              </td>
            </tr>
          `;
        }).join('')}
      </tbody>
    </table>
  `;
}

// ── Actions ──
async function addCookie() {
  const cookieStr = prompt('کوکی کامل Google را وارد کنید (SID=...; HSID=...; SSID=...; APISID=...; SAPISID=...; __Secure-1PSID=...; __Secure-1PSIDTS=...):\n\nبرای دریافت: F12 → Application → Cookies → gemini.google.com → Select All → Copy');
  if (!cookieStr) return;
  const label = prompt('برچسب (اختیاری):') || '';
  try {
    await api('admin/api/cookies', {
      method: 'POST',
      body: JSON.stringify({ cookie: cookieStr.trim(), label: label.trim(), authuser: 0 })
    });
    toast('کوکی با موفقیت افزوده شد', 'success');
    refreshPage();
  } catch (e) {
    toast('خطا: ' + e.message, 'error');
  }
}

async function checkCookie(id) {
  try {
    const r = await api(`admin/api/cookies/${id}/check`, { method: 'POST' });
    toast(r.ok ? 'کوکی سالم است ✓' : 'کوکی مشکل دارد: ' + (r.detail || ''), r.ok ? 'success' : 'error');
    refreshPage();
  } catch (e) { toast('خطا: ' + e.message, 'error'); }
}

async function rotateCookie(id) {
  try {
    await api(`admin/api/cookies/${id}/rotate`, { method: 'POST' });
    toast('کوکی رفرش شد', 'success');
    refreshPage();
  } catch (e) { toast('خطا: ' + e.message, 'error'); }
}

async function toggleCookie(id) {
  try {
    await api(`admin/api/cookies/${id}/toggle`, { method: 'POST' });
    toast('وضعیت تغییر کرد', 'success');
    refreshPage();
  } catch (e) { toast('خطا: ' + e.message, 'error'); }
}

async function deleteCookie(id) {
  if (!confirm('کوکی حذف شود؟')) return;
  try {
    await api(`admin/api/cookies/${id}`, { method: 'DELETE' });
    toast('کوکی حذف شد', 'success');
    refreshPage();
  } catch (e) { toast('خطا: ' + e.message, 'error'); }
}

async function saveDefaultModel() {
  const sel = document.getElementById('defaultModel');
  if (!sel) return;
  const body = {};
  // Get all config fields
  document.querySelectorAll('[id^="cfg_"]').forEach(el => {
    const key = el.id.replace('cfg_', '');
    if (el.type === 'checkbox') body[key] = el.checked;
    else if (el.type === 'number') body[key] = parseInt(el.value, 10);
    else body[key] = el.value;
  });
  body.default_model = sel.value;
  try {
    await api('admin/api/config', { method: 'PUT', body: JSON.stringify(body) });
    toast('مدل پیش‌فرض ذخیره شد', 'success');
  } catch (e) { toast('خطا: ' + e.message, 'error'); }
}

async function saveConfig() {
  const body = {};
  document.querySelectorAll('[id^="cfg_"]').forEach(el => {
    const key = el.id.replace('cfg_', '');
    if (el.type === 'checkbox') body[key] = el.checked;
    else if (el.type === 'number') body[key] = parseInt(el.value, 10);
    else body[key] = el.value;
  });
  try {
    await api('admin/api/config', { method: 'PUT', body: JSON.stringify(body) });
    toast('تنظیمات ذخیره شد ✓', 'success');
  } catch (e) { toast('خطا: ' + e.message, 'error'); }
}

function toggleKeyVis() {
  const el = document.getElementById('apiKeyValue');
  if (el) el.type = el.type === 'password' ? 'text' : 'password';
}

async function copyKey() {
  const el = document.getElementById('apiKeyValue');
  if (!el) return;
  try { await navigator.clipboard.writeText(el.value); toast('کپی شد ✓', 'success'); }
  catch (e) { el.type = 'text'; el.select(); document.execCommand('copy'); toast('کپی شد (حالت سازگار)', 'success'); }
}

async function rotateKey() {
  if (!confirm('کلید جدید تولید شود؟ کلایننت‌های موجود باید به‌روزرسانی شوند.')) return;
  try {
    const r = await api('admin/api/apikey', { method: 'POST' });
    toast('کلید جدید: ' + r.key, 'success');
    refreshPage();
  } catch (e) { toast('خطا: ' + e.message, 'error'); }
}

async function customKey() {
  const k = prompt('کلید جدید (حداقل 20 کاراکتر):');
  if (!k || k.length < 20) { toast('کلید باید حداقل 20 کاراکتر باشد', 'error'); return; }
  try {
    await api('admin/api/apikey', { method: 'PATCH', body: JSON.stringify({ key: k }) });
    toast('کلید تنظیم شد ✓', 'success');
    refreshPage();
  } catch (e) { toast('خطا: ' + e.message, 'error'); }
}

async function addProxy() {
  const name = prompt('نام پروکسی:');
  if (!name) return;
  const url = prompt('URL پروکسی (http://user:pass@host:port):');
  if (!url) return;
  try {
    await api('admin/api/proxies', {
      method: 'POST',
      body: JSON.stringify({ name, url, weight: 1 })
    });
    toast('پروکسی افزوده شد ✓', 'success');
    refreshPage();
  } catch (e) { toast('خطا: ' + e.message, 'error'); }
}

async function toggleProxy(id) {
  try { await api(`admin/api/proxies/${id}/toggle`, { method: 'POST' }); toast('تغییر کرد', 'success'); refreshPage(); }
  catch (e) { toast('خطا: ' + e.message, 'error'); }
}
async function resetProxy(id) {
  try { await api(`admin/api/proxies/${id}/reset`, { method: 'POST' }); toast('ریست شد', 'success'); refreshPage(); }
  catch (e) { toast('خطا: ' + e.message, 'error'); }
}
async function deleteProxy(id) {
  if (!confirm('پروکسی حذف شود؟')) return;
  try { await api(`admin/api/proxies/${id}`, { method: 'DELETE' }); toast('حذف شد', 'success'); refreshPage(); }
  catch (e) { toast('خطا: ' + e.message, 'error'); }
}

function refreshCookies() { refreshPage(); }

// ── Routing ──
const PAGE_TITLES = {
  dashboard: 'داشبورد',
  cookies: 'مدیریت کوکی',
  models: 'مدل‌ها',
  settings: 'تنظیمات',
  apikey: 'API Key',
  proxies: 'پروکسی‌ها',
  logs: 'گزارش‌ها',
};

function switchPage(name) {
  currentPage = name;
  document.querySelectorAll('.side-nav button').forEach(b =>
    b.classList.toggle('active', b.dataset.page === name));
  const titleEl = document.getElementById('pageTitle');
  if (titleEl) titleEl.textContent = PAGE_TITLES[name] || name;
  renderPage();
}

async function renderPage() {
  const main = document.getElementById('main');
  if (!main) return;
  const fn = pages[currentPage];
  if (!fn) { main.innerHTML = '<div class="empty-row">صفحه یافت نشد</div>'; return; }
  try {
    main.innerHTML = '<div style="padding:40px; text-align:center; color:var(--text-3);">در حال بارگذاری...</div>';
    const html = await fn();
    main.innerHTML = html;
  } catch (e) {
    main.innerHTML = `<div class="empty-row" style="color:var(--red);">خطا: ${escapeHtml(e.message)}</div>`;
  }
}

function refreshPage() { renderPage(); }

function renderShell() {
  document.getElementById('app').innerHTML = `
    <aside class="sidebar">
      <div class="side-header">
        <div class="side-brand">
          <div class="logo">G</div>
          <span>Gemini Web2API</span>
          <span class="ver">v4.31</span>
        </div>
      </div>
      <nav class="side-nav">
        ${[
          ['dashboard', 'داشبورد', ICONS.dashboard],
          ['cookies', 'کوکی‌ها', ICONS.cookie],
          ['models', 'مدل‌ها', ICONS.models],
          ['apikey', 'API Key', ICONS.key],
          ['proxies', 'پروکسی‌ها', ICONS.proxy],
          ['logs', 'گزارش‌ها', ICONS.chart],
          ['settings', 'تنظیمات', ICONS.settings],
        ].map(([key, label, icon]) => `
          <button data-page="${key}" onclick="switchPage('${key}')">
            <svg viewBox="0 0 24 24">${icon}</svg>
            <span>${label}</span>
          </button>
        `).join('')}
      </nav>
      <div class="side-footer">
        <div class="side-status">
          <div class="dot" id="healthDot"></div>
          <span id="healthText">بررسی اتصال...</span>
        </div>
      </div>
    </aside>
    <div class="main">
      <div class="topbar">
        <div class="topbar-title" id="pageTitle">داشبورد</div>
        <div class="topbar-right">
          <span class="badge-count green" id="modelBadge">— مدل</span>
          <span class="badge-count blue" id="cookieBadge">— کوکی</span>
        </div>
      </div>
      <div class="content" id="main"></div>
    </div>
  `;
  switchPage('dashboard');
  updateBadges();
}

async function updateBadges() {
  try {
    const cfgData = await api('admin/api/config');
    const models = cfgData.models || [];
    const ck = await api('admin/api/cookies');
    const cookies = ck.items || [];
    const alive = cookies.filter(c => c.status === 'enabled' && c.health !== 'dead').length;
    const modelBadge = document.getElementById('modelBadge');
    const cookieBadge = document.getElementById('cookieBadge');
    const healthDot = document.getElementById('healthDot');
    const healthText = document.getElementById('healthText');
    if (modelBadge) modelBadge.textContent = models.length + ' مدل';
    if (cookieBadge) {
      cookieBadge.textContent = alive + ' کوکی فعال';
      cookieBadge.className = 'badge-count ' + (alive > 0 ? 'green' : 'red');
    }
    if (healthDot && healthText) {
      const ok = alive > 0;
      healthDot.className = 'dot' + (ok ? '' : ' red');
      healthText.textContent = ok ? 'متصل' : 'بدون کوکی';
    }
  } catch (e) {}
}

// ── Login ──
function renderLogin() {
  document.getElementById('app').innerHTML = `
    <div class="login-box">
      <h1><span style="font-size:24px;">🔑</span> Gemini Web2API</h1>
      <input id="tokenInput" type="password" placeholder="توکن ادمین" />
      <button class="btn btn-primary" onclick="doLogin()">ورود</button>
      <div id="loginErr" class="login-err"></div>
    </div>
  `;
  document.getElementById('tokenInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });
}

async function doLogin() {
  const tok = document.getElementById('tokenInput').value;
  if (tok === ADMIN_TOKEN) {
    renderShell();
  } else {
    document.getElementById('loginErr').textContent = 'توکن نادرست';
  }
}

// ── Boot ──
(async () => {
  // Try to fetch stats — if 401, show login
  try {
    await api('admin/api/stats?hours=1');
    renderShell();
  } catch (e) {
    renderLogin();
  }
})();
</script>
